<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- <script src="./tailwind.js"></script> -->
    <title>Email Subscribe</title>
  </head>
  <body>
    <div class="w-screen h-screen bg-gray-500 flex items-center justify-center">
      <div class="w-[700px] h-72 bg-gray-800 rounded-2xl flex">
        <div class="w-1/3 h-full p-2 mt-3 items-center justify-center">
          <img class="rounded-md" src="./images/image.jpg" alt="" />
        </div>
        <div class="w-full flex items-center justify-center">
          <div class="text-white space-y-4">
            <h1 class="font-serif text-2xl">
              Get Diet and fitness tips in your inbox
            </h1>
            <p>
              Eat better and exercise better. Sign up for the <br />
              diet&fitness newslatter
            </p>
            <div class="space-x-2">
              <input
                class="px-5 py-2 bg-gray-900 border border-gray-300 rounded placeholder:text-gray-300 outline-none"
                type="text"
                placeholder="Enter your email address"
              />
              <button
                class="bg-green-600 px-3 py-2 hover:bg-green-700 text-gray-800 rounded-md"
              >
                Subscribe
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
