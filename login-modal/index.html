<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Modal</title>
    <link rel="stylesheet" href="src/output.css" />

    <!-- Google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Rokkitt:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Global container -->
    <div class="flex items-center justify-center min-h-screen bg-rose-50">
      <!-- Card container -->
      <div
        class="relative flex flex-col m-6 space-y-10 bg-white shadow-2xl rounded-2xl md:flex-row md:space-y-0 md:m-0"
      >
        <!-- Left side -->
        <div class="p-6 md:p-20">
          <!-- Top content -->
          <h2 class="font-[Rokkitt] mb-5 text-4xl">Log In</h2>
          <p class="max-w-sm mb-12 font-[Mulish] font-light text-gray-600">
            Log in to your account to upload or download pictures, video or
            music.
          </p>
          <input
            type="text"
            placeholder="Enter your email address"
            spellcheck="false"
            class="w-full p-6 border border-gray-300 rounded-md placeholder:font-[Mulish] placeholder:font-light focus:outline-none"
          />

          <!-- Middle content -->
          <div
            class="flex flex-col items-center justify-between mt-6 space-y-6 md:flex-row md:space-y-0"
          >
            <div class="font-light text-cyan-700 cursor-pointer select-none">
              <a href="#">Forgot password</a>
            </div>

            <button
              class="w-full md:w-auto flex justify-center items-center px-9 py-6 space-x-4 font-[Mulish] font-bold text-white cursor-pointer rounded-md shadow-sm bg-cyan-700 shadow-cyan-100 transition duration-150 hover:bg-cyan-700/90 hover:shadow-lg hover:-translate-y-0.5"
            >
              <span>Next</span>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-7"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="#ffffff"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <line x1="5" y1="12" x2="19" y2="12" />
                <line x1="13" y1="18" x2="19" y2="12" />
                <line x1="13" y1="6" x2="19" y2="12" />
              </svg>
            </button>
          </div>

          <!-- Border -->
          <div class="mt-12 border-b border-b-gray-300"></div>

          <!-- Bottom content -->
          <p class="py-6 text-sm font-light text-center text-gray-500">
            or log in with
          </p>

          <!-- Bottom buttons container -->
          <div
            class="flex flex-col space-x-0 space-y-6 md:flex-row md:space-x-4 md:space-y-0"
          >
            <button
              class="flex items-center justify-center py-2 space-x-3 border border-gray-300 rounded shadow-sm cursor-pointer hover:shadow-lg hover:-translate-y-0.5 transition duration-150 md:w-1/2"
            >
              <img src="images/facebook.png" class="w-9" />
              <span class="font-light">Facebook</span>
            </button>
            <button
              class="flex items-center justify-center py-2 space-x-3 border border-gray-300 rounded shadow-sm cursor-pointer hover:shadow-lg hover:-translate-y-0.5 transition duration-150 md:w-1/2"
            >
              <img src="images/google.png" class="w-9" />
              <span class="font-light">Google</span>
            </button>
          </div>
        </div>

        <!-- Right side -->
        <img src="images/image.jpg" alt="" class="w-[430px] hidden md:block" />
      </div>

      <!-- Close button -->
      <!-- <div
        class="group absolute -top-5 right-4 flex items-center justify-center w-10 h-10 bg-gray-200 rouned-full"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-6 h-6 text-black group-hover:text-gray-600"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </div> -->
    </div>
  </body>
</html>
